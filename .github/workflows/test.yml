name: Test

# Kører ved hver ændring. Fejler en test, må ændringen ikke komme ind i main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: kun-til-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:kun-til-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser til login-testen
        run: pnpm --filter @jhfs/api exec playwright install --with-deps chromium
      - name: Typetjek
        run: pnpm typecheck
      - name: Tests (inkl. 2025-facit, firma-adskillelse og login i rigtig browser)
        run: pnpm test

  # Bygger programmet præcis som på serveren og tjekker at det starter og kører migrationerne.
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Testmiljø (kun til CI)
        working-directory: deploy
        run: |
          {
            echo "DOMAENE=localhost"
            echo "DB_ADMIN_KODE=$(openssl rand -hex 16)"
            echo "DB_APP_KODE=$(openssl rand -hex 16)"
          } > .env
      - name: Byg og start database, migrationer og program
        working-directory: deploy
        run: docker compose up -d --build --wait db app
      - name: Migrationerne er kørt
        working-directory: deploy
        run: test "$(docker compose ps -a migrer --format '{{.ExitCode}}')" = "0"
      - name: Programmet svarer og kører som almindelig bruger
        working-directory: deploy
        run: |
          docker compose exec -T app node -e "fetch('http://127.0.0.1:3000/sundhed').then(r=>r.json()).then(j=>{console.log(j);process.exit(j.status==='ok'?0:1)})"
          test "$(docker compose exec -T app id -u)" != "0"
      - name: Opret ejer virker (administrationskommando)
        working-directory: deploy
        run: docker compose exec -T app node --import tsx src/admin-cli.ts opret-ejer --firma "CI Test ApS" --email ci@test.dk --navn "CI"
      - name: Log ved fejl
        if: failure()
        working-directory: deploy
        run: docker compose logs
